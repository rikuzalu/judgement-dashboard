<!DOCTYPE html>

<head>

<title>X投稿ダッシュボード</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;padding:12px;min-height:100vh}
.hdr{text-align:center;padding:20px 0 12px;border-bottom:1px solid rgba(0,180,255,.15);margin-bottom:16px}
.hdr h1{font-size:20px;color:#fff;margin-bottom:4px}
.hdr .sub{font-size:12px;color:rgba(255,255,255,.35)}
.stats{margin-top:8px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.45)}
.sn{font-size:17px;font-weight:800;background:linear-gradient(135deg,#00B4FF,#00E8FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sn.g{background:linear-gradient(135deg,#28c840,#20a836);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ctrl{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fb,.tb{padding:4px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:rgba(255,255,255,.45);font-size:10px;cursor:pointer;transition:all .2s}
.fb:hover,.fb.on{background:rgba(0,180,255,.12);border-color:rgba(0,180,255,.3);color:#00B4FF}
.tb{background:rgba(40,200,64,.06);border-color:rgba(40,200,64,.12);color:rgba(40,200,64,.5)}
.tb:hover,.tb.on{background:rgba(40,200,64,.15);border-color:rgba(40,200,64,.3);color:#28c840}
.sp{flex:1}.pc{font-size:10px;color:rgba(255,255,255,.25)}
.pc strong{color:#28c840}
.cat{margin-bottom:28px}
.ct{font-size:15px;font-weight:700;color:#fff;padding:8px 12px;background:rgba(0,180,255,.06);border-left:3px solid #00B4FF;border-radius:0 6px 6px 0;margin-bottom:10px}
.ct .tg{font-size:9px;color:#00B4FF;background:rgba(0,180,255,.12);padding:1px 6px;border-radius:8px;margin-left:6px}
.ct .vt{font-size:9px;color:#ff6b6b;background:rgba(255,107,107,.12);padding:1px 6px;border-radius:8px;margin-left:3px}
.cd{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-bottom:12px;transition:all .3s}
.cd:hover{border-color:rgba(0,180,255,.2)}
.cd.done{opacity:.2;transform:scale(.98)}.cd.hid{display:none}
.ct2{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.au{font-size:12px;font-weight:600;color:#00B4FF}
.vw{font-size:9px;color:#ff6b6b;background:rgba(255,107,107,.08);padding:1px 6px;border-radius:8px}
.og{font-size:10px;color:rgba(255,255,255,.3);line-height:1.5;margin-bottom:4px}
.ul{display:inline-block;font-size:9px;color:rgba(0,180,255,.45);text-decoration:none;word-break:break-all;margin-bottom:8px}
.ul:hover{color:#00B4FF}
.tr{display:flex;gap:0;margin-bottom:6px}
.tn{padding:4px 10px;font-size:10px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.35);background:rgba(255,255,255,.02)}
.tn:first-child{border-radius:6px 0 0 6px}.tn:last-child{border-radius:0 6px 6px 0}
.tn.on{background:rgba(0,180,255,.1);border-color:rgba(0,180,255,.25);color:#00B4FF}
.tn.rp.on{background:rgba(138,43,226,.1);border-color:rgba(138,43,226,.25);color:#B44AFF}
.tc{display:none}.tc.on{display:block}
/* パターン選択 */
.ps{display:flex;gap:4px;margin-bottom:6px}
.pb{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.pb:hover{border-color:rgba(0,180,255,.3);color:#00B4FF}
.pb.on{background:rgba(0,180,255,.15);border-color:#00B4FF;color:#00B4FF}
.pb.rp.on{background:rgba(138,43,226,.15);border-color:#B44AFF;color:#B44AFF}
.pt{display:none}.pt.on{display:block}
.tx{font-size:12px;line-height:1.8;color:#fff;white-space:pre-wrap;background:rgba(0,180,255,.04);border:1px solid rgba(0,180,255,.06);border-radius:6px;padding:12px;position:relative;cursor:pointer;transition:background .2s}
.tx:hover{background:rgba(0,180,255,.08)}
.tx.rt{background:rgba(138,43,226,.04);border-color:rgba(138,43,226,.06)}
.tx.rt:hover{background:rgba(138,43,226,.08)}
.tx::after{content:'COPY';position:absolute;top:4px;right:8px;font-size:8px;color:rgba(255,255,255,.15);letter-spacing:1px;pointer-events:none}
.tx:hover::after{color:rgba(255,255,255,.4)}
.tx.cp{background:rgba(40,200,64,.08)!important;border-color:rgba(40,200,64,.15)!important}
.tx.cp::after{content:'COPIED!';color:#28c840}
.cc{text-align:right;font-size:9px;color:rgba(255,255,255,.15);margin-top:2px}
.ck{display:flex;align-items:center;gap:5px;margin-top:8px}
.cl{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;font-size:10px;color:rgba(255,255,255,.25)}
.cl input{display:none}
.cu{width:16px;height:16px;border-radius:4px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center;transition:all .2s}
.cl input:checked+.cu{border-color:#28c840;background:rgba(40,200,64,.12)}
.cl input:checked+.cu::after{content:'\2713';color:#28c840;font-size:11px;font-weight:700}
.cl input:checked~.cx{color:#28c840}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:#28c840;color:#fff;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:600;opacity:0;transition:all .3s;z-index:1000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){body{padding:8px}.tx{font-size:11px;padding:10px}}
</style>
</head>

<script>
const SK='qt_v3';let hp=true;
const D=[
// === Karpathy ===
{id:'kp1',cat:'kp',au:'Andrej Karpathy',vw:'数百万',og:'autoresearchの次のステップ：SETI@homeスタイルの大規模非同期エージェントコラボ。1人のPhDではなく研究コミュニティを再現する',url:'https://x.com/karpathy/status/2030705271627284816',
qt:[
`「1人の天才を模倣するんじゃない。\nコミュニティを模倣するんだ」\n\nこれ、AIエージェント時代の本質。\n\n"優秀な個"より"連携する組織"。\n\n1体のAIをどれだけ賢くしても限界がある。\nでも複数体が非同期で連携したら\n人間の組織と同じ構造が生まれる。\n\n「マネジメント」のスキルが\nAIに対しても必要になる時代、来てる。`,
`SETI@homeを知ってる人なら\nこの例えの凄さがわかる。\n\n世界中の普通のPCが\n1つの目的のために分散処理する。\n\nKarpathyはこれを\nAIエージェントでやろうとしてる。\n\n1体のスーパーAIを作るより\n1000体の専門AIを連携させる方が\n結果的に強い。\n\n生物の進化と同じ構造。`,
`この投稿、AIの歴史に残ると思う。\n\n「単体の知能」を追い求めた時代から\n「集合知としてのAI」へ。\n\nパラダイムシフトの瞬間を\nリアルタイムで見てる感覚。\n\n次の10年のAI開発の方向性が\nこの1ツイートに凝縮されてる。`],
rp:[
`SETI@homeの例え、完璧すぎる。\n\n分散してるけど全体として1つの目的に向かう。\nまさにエージェント群のあるべき姿。\n\n「どう連携させるか」の設計論が\nまだ確立してないのが課題ですが、\nこの方向性がスタンダードになりそうですね。`,
`これ、研究だけじゃなくて\nビジネスにも完全に当てはまりますよね。\n\n営業、開発、マーケ、CS…\n専門エージェントが非同期で連携する。\n\n人間の組織論がそのまま\nAIの設計論になる時代。`,
`「emulate a research community」\nこのフレーズ、刺さりました。\n\n単体AIの限界を超える方法が\n「もっと賢くする」じゃなくて\n「もっと連携させる」だったのは\n直感に反するけど正しい。`]},

{id:'kp2',cat:'kp',au:'Greg Isenberg',vw:'数百万',og:'「karpathy just broke the internet with auto research — AIリサーチエージェントが24/7実験を回す」',url:'https://x.com/gregisenberg/status/2031870162702381515',
qt:[
`「寝てる間に100回実験して、\n勝ちパターンだけ残してくれる」\n\nこれ、研究だけの話じゃない。\n\nマーケのA/Bテスト、LPの最適化、\n価格戦略の検証——\n\nあらゆるビジネスの意思決定が\n「人間が考える」から\n「AIが実験して人間が判断する」に変わる。`,
`「broke the internet」は\n大げさじゃない。\n\nこれまで：人間が仮説→実験→分析\n（1サイクル数日〜数週間）\n\nこれから：AIが仮説→実験→分析→改善\n（1サイクル5分、寝てる間に100回）\n\n意思決定の速度が\n100倍になるってこと。\n\n競争のルールが変わる。`,
`Isenbergのこの投稿のおかげで\n技術者以外にもautoresearchが広まった。\n\n「研究を自動化する」って聞くと\n遠い話に聞こえるけど、\n\n「LPの改善を自動で回す」\n「広告のABテストを寝てる間に100回」\nって聞くと全員に刺さる。\n\n翻訳力って大事。`],
rp:[
`「broke the internet」は\n大げさじゃないですね。\n\n本質は\n「人間がゴールを設定して\nAIが手段を最適化する」\nという役割分担が明確になったこと。\n\n「何を改善するか」を定義できる人が\n最も価値を持つ時代に入った。`,
`これのビジネス応用を\n真剣に考えるべきタイミングですよね。\n\nLP最適化、広告クリエイティブ、\nプライシング、UXフロー…\n\n全部「autoresearchパターン」で\n自動最適化できる。`,
`Isenbergがこれを取り上げた時点で\nビジネス層への浸透が加速しましたね。\n\n技術系の人は前から知ってたけど、\n「マーケに使える」って翻訳されると\n一気にリーチが変わる。`]},

{id:'kp3',cat:'kp',au:'Andrej Karpathy',vw:'100万+',og:'autoresearchパッケージ化。630行・GPU1枚。人間がプロンプトを磨き、AIがコードを最適化する',url:'https://x.com/karpathy/status/2030371219518931079',
qt:[
`630行。GPU1枚。\n\nこれだけでAIが自分で実験を回し続けて\n勝ちパターンを見つけてくれる。\n\n「何を最適化すべきか」を定義する力。\nこれが2026年の最重要スキル。`,
`Karpathyが「週末に遊んでみて」と\nカジュアルに出したのがまた凄い。\n\n630行の中に\n人類のAI研究を変えるアイデアが入ってる。\n\n「小さく作って、大きく考える」の\n究極の体現。`,
`たった630行なのに\nGPT-2レベルのモデルを\n1.8時間、$50以下で学習できる。\n\n「AI研究は大企業しかできない」\nっていう常識が完全に崩壊した瞬間。\n\n個人でもAI研究ができる時代。`],
rp:[
`630行に収まるのが\n本当にすごいですね。\n\n複雑さは価値じゃない。\nシンプルさこそが再現性を生む。`,
`これを自分のドメインに応用する人が\n今週末から爆発的に増えそう。\n\n研究、マーケ、プロダクト開発…\n応用先が無限。`,
`「週末に遊んでみて」のカジュアルさと\n中身のインパクトのギャップが\nKarpathyらしくて最高です。`]},

// === Meta x Manus ===
{id:'mn1',cat:'mn',au:'Deedy Das',vw:'100万+',og:'「Meta just bought Manus for >$1B. 消費者AI $100M+ ARRは8社のみ。Meta AIにはプロダクトがない。最も安くAlignedな買収」',url:'https://x.com/deedydas/status/2005798365733478490',
qt:[
`$100M+ ARRの消費者AIアプリ、\nまだ世界に8社しかない。\n\nPerplexity $20B\nElevenLabs $6.6B\nLovable $6.6B\nReplit $3B+\nManus $500M（→Meta買収）\n\n「作る側」は飽和してきたけど\n「使う側のプロダクト」はまだ8社。\n\nここにチャンスがある。`,
`Deedy のこの分析が的確すぎる。\n\n「Meta AIにはプロダクトがない」\n\n30億人のユーザーベースがあっても\nAIプロダクトがなければ意味がない。\n\n技術じゃなくてプロダクト力を買った。\nAI時代でもUXが勝負を決める。`,
`消費者AIで$100M ARR超え、\nたった8社。\n\nB2B SaaSならもっといるけど\n消費者向けはまだこれだけ。\n\nつまりまだ「AIの消費者革命」は\n始まったばかり。\n\n次の8社に入るチャンスは\nまだ十分ある。`],
rp:[
`「Meta AIにはプロダクトがない」\nこれが全てを物語ってますよね。\n\n30億人のユーザーベースがあっても\nAIプロダクトがなければ意味がない。\n\nManus買収は「技術」じゃなくて\n「プロダクト力」を買った。`,
`この8社のリスト、\n定期的にウォッチしたい。\n\n次にここに入る会社が\nAI時代の勝者になる。`,
`$100M ARR到達8社中、\n日本の会社がゼロなのが\n一番気になるポイントです。`]},

{id:'mn2',cat:'mn',au:'Financial Times',vw:'500万+',og:'「MetaのManus買収は米テック大手が中国ルーツのAIを獲得する稀な例。米中AI競争の火種に」',url:'https://x.com/FT/status/2006017711768256575',
qt:[
`この買収、テック視点だけで見ちゃダメ。\n\n地政学の話。\n\n中国ルーツのAIスタートアップを\n米テック大手が買収する。\n\nAI競争が国家間の問題になってる中で\nMetaがこれをやったのはかなりのリスクテイク。\n\n「技術に国境はない」のか\n「AIには国境がある」のか。`,
`FTがこう報じるということは\nワシントンも北京も注視してる。\n\n$2Bの買収が\n米中AI戦争の新たな火種になるかもしれない。\n\nAI企業の経営判断が\n国家安全保障の議論になる時代。\n\n2026年、異常すぎる。`,
`10日で合意。$2-3B。\n中国ルーツ。\n\nこれだけの条件が揃って\nなお買収に踏み切ったということは\nAIエージェントの価値が\nそれだけ高いということ。\n\nリスクを上回るリターンがある\nとMetaは判断した。`],
rp:[
`地政学リスクを超えてでも\n買収に踏み切ったということは\nAIエージェントの価値がそれだけ高い。\n\n10日で合意という速さも含めて\n市場の争奪戦の熾烈さが伝わります。`,
`この買収の行方を見てれば\n「AIに国境はあるか」の答えが\n2026年後半に見えてきそうですね。`,
`FTの報道トーンが\n明らかに「地政学リスク」寄りなのが\n示唆的ですね。\n\n純粋なビジネスニュースじゃなくて\n国際政治の文脈で語られてる。`]},

{id:'mn3',cat:'mn',au:'Greg Isenberg',vw:'100万+',og:'「Manusはdistributionを最優先投資として扱い、クリエイターに重課金してアテンションを獲得した」',url:'https://x.com/gregisenberg/status/2006016564751908885',
qt:[
`Manusの勝因、技術じゃなくて\n「配信戦略」だったの面白すぎる。\n\n技術力 < 配信力。\n\nAI時代は「作れる」が当たり前。\n「届けられる」が最大の差別化。\n\nこの逆転、もっと議論されるべき。`,
`Manusのプレイブック：\n1. プロダクトを作る\n2. インフルエンサーに使わせる\n3. バイラルで一気に拡散\n4. $100M ARR最速達成\n5. Metaに$2Bで買収される\n\n全工程2年未満。\n\nAI時代のスタートアップ\nスピードランの教科書。`,
`「distribution as a first-class expense」\n\nこの表現が全てを語ってる。\n\n多くのスタートアップが\n開発に全リソースを注いで配信を後回しにする。\n\nManusは逆。\n最初からクリエイターマーケに投資した。\n\nAI時代の正解、見えてきた。`],
rp:[
`distribution as first-class expense\n刺さりすぎる表現ですね。\n\nAIの時代は「作れる」が前提になったから\n「届けられる」が最大の差別化。`,
`クリエイターに「使ってもらう」投資、\n日本のAIスタートアップでやってる会社\nほぼ見たことないですね。\n\nここにヒントがある。`,
`技術力 vs 配信力の議論、\nAI業界全体で必要ですよね。\n\n「いいもの作れば売れる」は\n2026年では通用しない。`]},

// === Claude Code ===
{id:'cc1',cat:'cc',au:'Jaana Dogan (Google Principal Engineer)',vw:'540万',og:'「冗談じゃなくこれ笑えない。Googleで1年かけた分散エージェントオーケストレーター、Claude Codeに説明したら1時間で生成された」',url:'https://x.com/rakyll/status/2007239758158975130',
qt:[
`Googleのプリンシパルエンジニアが\n「1年→1時間」と告白。540万回表示。\n\nでも本人の補足が本質。\n「1年間の知見があったから\n3段落で伝えられた」\n\n重要なのは「AIが速い」じゃなくて\n「人間の知見×AIの実行速度」の掛け算。\n\n経験の価値は消えない。むしろ増す。`,
`この投稿、2つの読み方がある。\n\n悲観：「1年の仕事が1時間で…」\n楽観：「1年の知見があれば1時間で形にできる」\n\n後者が正しい。\n\nAIは「実装」を高速化するけど\n「何を作るべきか」の判断力は\n人間の経験からしか生まれない。`,
`540万回表示されたこの投稿、\n「AIに仕事を奪われる」文脈で\n読まれがちだけど、\n\n本人は「trivial to rebuild\nonce you have the knowledge」\nと言ってる。\n\n知識があれば再構築は簡単。\n知識を得るプロセスこそが価値。\n\nこの視点、もっと広まるべき。`],
rp:[
`後の補足が本質ですよね。\n\n「1年間学んで、パターンを見つけて、\n3段落で説明したら1時間でできた」\n\nAIに仕事を奪われる人と\nAIで仕事が加速する人の違いは\nこの「知見」の有無。`,

// === レンダリング ===
function render(){
const cats={kp:'Karpathy — autoresearch & AgentHub',mn:'Meta x Manus AI — $2B買収',cc:'Claude Code — Google告白 & 覇権',cd:'Codex / Devin — AIコーディング',oc:'OpenClaw — 1人で180K stars',mk:'マーケット & ビジョン'};
const tags={kp:'MEGA VIRAL',mn:'BIG NEWS',cc:'540万views',cd:'410万views',oc:'180K STARS',mk:'HIGH IMPACT'};
let html='';
for(const[c,title]of Object.entries(cats)){
const items=D.filter(d=>d.cat===c);if(!items.length)continue;
html+=`<div class="cat" data-ct="${c}"><div class="ct">${title} <span class="tg">${tags[c]}</span></div>`;
for(const d of items){
html+=`<div class="cd" data-cat="${d.cat}" data-id="${d.id}">
<div class="ct2"><span class="au">${d.au}</span><span class="vw">${d.vw} views</span></div>
<div class="og">${d.og}</div>
<a class="ul" href="${d.url}" target="_blank">${d.url.replace('https://','')}</a>
<div class="tr">
<div class="tn on" onclick="st(this,'qt')">引用リプライ</div>
<div class="tn rp" onclick="st(this,'rp')">リプライ</div>
</div>
<div class="tc on" data-tab="qt">
<div class="ps">${d.qt.map((_,i)=>`<div class="pb${i===0?' on':''}" onclick="sp(this,${i})">${i+1}</div>`).join('')}</div>
${d.qt.map((t,i)=>`<div class="pt${i===0?' on':''}">\n<div class="tx" onclick="cp(this)">${t}</div>\n<div class="cc"></div></div>`).join('')}
</div>
<div class="tc" data-tab="rp">
<div class="ps">${d.rp.map((_,i)=>`<div class="pb rp${i===0?' on':''}" onclick="sp(this,${i})">${i+1}</div>`).join('')}</div>
${d.rp.map((t,i)=>`<div class="pt${i===0?' on':''}">\n<div class="tx rt" onclick="cp(this)">${t}</div>\n<div class="cc"></div></div>`).join('')}
</div>
<div class="ck"><label class="cl"><input type="checkbox" onchange="oc(this)"><span class="cu"></span><span class="cx">投稿済み</span></label></div>
</div>`;
}
html+='</div>';
}
document.getElementById('cards').innerHTML=html;
// 文字数
document.querySelectorAll('.tx').forEach(e=>{const n=e.nextElementSibling;if(n&&n.classList.contains('cc'))n.textContent=e.innerText.length+'文字'});
// 復元
const p=gp();
document.querySelectorAll('.cd').forEach(c=>{
if(p.has(c.dataset.id)){c.querySelector('input').checked=true;c.classList.add('done');if(hp)c.classList.add('hid')}
});
uc();
}

// タブ
function st(btn,tab){
const cd=btn.closest('.cd');
cd.querySelectorAll('.tn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
cd.querySelectorAll('.tc').forEach(c=>c.classList.toggle('on',c.dataset.tab===tab));
}
// パターン
function sp(btn,i){
const ps=btn.parentElement;
ps.querySelectorAll('.pb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
const tc=ps.parentElement;
tc.querySelectorAll('.pt').forEach((p,j)=>p.classList.toggle('on',j===i));
}

// Storage
function gp(){try{return new Set(JSON.parse(localStorage.getItem(SK)||'[]'))}catch{return new Set()}}
function svp(s){localStorage.setItem(SK,JSON.stringify([...s]))}

function oc(cb){
const cd=cb.closest('.cd'),id=cd.dataset.id,p=gp();
if(cb.checked){p.add(id);cd.classList.add('done');tw('投稿済み!');if(hp)setTimeout(()=>{cd.classList.add('hid');uc()},400)}
else{p.delete(id);cd.classList.remove('done','hid');tw('戻しました')}
svp(p);uc();
}
function uc(){
const t=D.length,d=gp().size;
document.getElementById('rc').textContent=t-d;
document.getElementById('dc').textContent=d;
document.getElementById('tc2').textContent=t;
}
function thp(){
hp=!hp;const b=document.getElementById('hpb');
b.classList.toggle('on',hp);b.textContent=hp?'投稿済み非表示':'全て表示';
const p=gp();
document.querySelectorAll('.cd').forEach(c=>{if(p.has(c.dataset.id))c.classList.toggle('hid',hp)});
}
function fl(cat){
document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));event.target.classList.add('on');
document.querySelectorAll('.cd').forEach(c=>{c.style.display=(cat==='all'||c.dataset.cat===cat)?'':'none'});
document.querySelectorAll('.cat').forEach(c=>{if(cat==='all'){c.style.display=''}else{c.style.display=c.dataset.ct===cat?'':'none'}});
}
function cp(el){navigator.clipboard.writeText(el.innerText).then(()=>{el.classList.add('cp');tw('コピーしました!');setTimeout(()=>el.classList.remove('cp'),2000)})}
function tw(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

render();
</script>
