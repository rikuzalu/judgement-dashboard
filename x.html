<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>X-OPS | AI Content Command Center</title>
<style>
:root{--bg:#050508;--card:#0c0c14;--card2:#10101c;--border:#1a1a2e;--accent:#1d9bf0;--accent2:#0ea5e9;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--purple:#a855f7;--orange:#f97316;--pink:#ec4899;--text:#e8e8f0;--dim:#6b7280;--glow:0 0 20px rgba(29,155,240,.15);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:300px;background:radial-gradient(ellipse at 50% 0%,rgba(29,155,240,.08) 0%,transparent 70%);pointer-events:none;z-index:0}

/* ヘッダー */
.header{background:rgba(8,8,16,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(29,155,240,.1);padding:14px 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.logo-sub{color:var(--dim);font-size:11px;font-weight:400}
.updated{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(34,197,94,0)}}

/* KPIバー */
.kpi-bar{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.kpi-bar::-webkit-scrollbar{display:none}
.kpi{background:linear-gradient(145deg,rgba(16,16,28,.8),rgba(12,12,20,.9));border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:85px;text-align:center;flex-shrink:0;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0}
.kpi:nth-child(1)::before{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.kpi:nth-child(2)::before{background:linear-gradient(90deg,var(--green),#34d399)}
.kpi:nth-child(3)::before{background:linear-gradient(90deg,var(--purple),var(--pink))}
.kpi:nth-child(4)::before{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.kpi-val{font-size:20px;font-weight:900;letter-spacing:-.5px}
.kpi-label{font-size:9px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}

/* タブ */
.tabs{display:flex;background:rgba(8,8,16,.95);backdrop-filter:blur(20px);position:sticky;top:62px;z-index:99;padding:0 8px;gap:2px}
.tab{flex:1;padding:12px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;text-transform:uppercase;letter-spacing:.3px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(29,155,240,.5)}
.tab:active{transform:scale(.95)}

/* タブコンテンツ */
.tab-content{display:none;padding:12px;position:relative;z-index:1;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* フィルタバー */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;cursor:pointer;transition:all .2s;font-weight:600}
.filter-btn:active{transform:scale(.95)}
.filter-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(29,155,240,.3)}

/* バズカード */
.buzz-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .3s;position:relative;overflow:hidden}
.buzz-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(29,155,240,.3),transparent)}
.buzz-card.posted{opacity:.25;transform:scale(.98)}
.buzz-card.hidden{display:none}
.buzz-card:active{transform:scale(.99)}
.buzz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.buzz-author{font-weight:800;font-size:15px;letter-spacing:-.3px}
.buzz-handle{color:var(--dim);font-size:11px;margin-left:6px}
.badge{padding:4px 10px;border-radius:6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.badge.high{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.1));color:var(--red);border:1px solid rgba(239,68,68,.2);animation:urgentPulse 3s infinite}
.badge.medium{background:rgba(234,179,8,.12);color:var(--yellow);border:1px solid rgba(234,179,8,.2)}
.badge.low{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.2)}50%{box-shadow:0 0 12px 2px rgba(239,68,68,.15)}}
.buzz-summary{font-size:13px;color:#a0a0b8;margin-bottom:10px;line-height:1.6}
.buzz-stats{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--dim)}
.buzz-views{display:flex;align-items:center;gap:4px}
.buzz-views::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent);display:inline-block}
.buzz-link{color:var(--accent);text-decoration:none;font-size:11px;font-weight:600;transition:opacity .2s}
.buzz-link:active{opacity:.7}

/* コンテンツ切替 */
.type-tabs{display:flex;gap:6px;margin:12px 0 10px}
.type-tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;border:1px solid var(--border);color:var(--dim);transition:all .2s}
.type-tab:active{transform:scale(.97)}
.type-tab.active-qt{background:linear-gradient(135deg,rgba(29,155,240,.15),rgba(14,165,233,.1));color:var(--accent);border-color:rgba(29,155,240,.3);box-shadow:0 0 12px rgba(29,155,240,.1)}
.type-tab.active-rp{background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(236,72,153,.1));color:var(--purple);border-color:rgba(168,85,247,.3);box-shadow:0 0 12px rgba(168,85,247,.1)}

/* パターン選択 */
.patterns{display:flex;gap:8px;margin-bottom:10px}
.pat-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:transparent;color:var(--dim);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.pat-btn:active{transform:scale(.9)}
.pat-btn.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(29,155,240,.4)}

/* テキストエリア */
.content-box{background:rgba(8,8,16,.6);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.75;cursor:pointer;position:relative;min-height:60px;word-wrap:break-word;transition:all .2s}
.content-box:active{background:rgba(29,155,240,.05);border-color:rgba(29,155,240,.2)}
.char-count{text-align:right;font-size:10px;color:var(--dim);margin-top:4px}

/* チェックボックス */
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.check-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s}
.check-btn:active{transform:scale(.95)}
.check-btn.checked{background:linear-gradient(135deg,var(--green),#34d399);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(34,197,94,.3)}
.recommend{font-size:10px;padding:4px 10px;border-radius:6px;background:rgba(29,155,240,.08);color:var(--accent);font-weight:700;border:1px solid rgba(29,155,240,.15)}

/* スレッドカード */
.thread-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.thread-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(249,115,22,.3),transparent)}
.thread-title{font-weight:800;font-size:16px;margin-bottom:8px;letter-spacing:-.3px}
.thread-tweet{background:rgba(8,8,16,.5);border-left:3px solid;border-image:linear-gradient(to bottom,var(--accent),var(--purple)) 1;padding:12px 14px;margin:8px 0;border-radius:0 10px 10px 0;font-size:13px;line-height:1.7;cursor:pointer;transition:all .2s}
.thread-tweet:active{background:rgba(29,155,240,.05)}
.thread-num{color:var(--accent);font-weight:800;margin-right:6px}
.copy-all-btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:13px;cursor:pointer;margin-top:10px;transition:all .2s}
.copy-all-btn:active{background:rgba(29,155,240,.1);transform:scale(.98)}

/* Notes */
.note-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.note-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(168,85,247,.3),transparent)}
.note-title{font-weight:800;font-size:17px;margin-bottom:6px;letter-spacing:-.3px}
.note-preview{font-size:13px;color:#8888a8;line-height:1.7;max-height:100px;overflow:hidden;margin-bottom:12px;-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent)}

/* パフォーマンス */
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.perf-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;position:relative;overflow:hidden}
.perf-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.perf-card:nth-child(1)::before{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.perf-card:nth-child(2)::before{background:linear-gradient(90deg,var(--green),#34d399)}
.perf-card:nth-child(3)::before{background:linear-gradient(90deg,var(--orange),var(--yellow))}
.perf-card:nth-child(4)::before{background:linear-gradient(90deg,var(--purple),var(--pink))}
.perf-val{font-size:24px;font-weight:900;letter-spacing:-.5px}
.perf-label{font-size:9px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.perf-input-group{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.perf-input-group h3{font-size:14px;margin-bottom:12px;font-weight:800}
.input-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.input-row label{font-size:12px;color:var(--dim);min-width:60px;font-weight:600}
.input-row input,.input-row select{flex:1;background:rgba(8,8,16,.6);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;transition:border-color .2s}
.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px rgba(29,155,240,.1)}
.save-btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.save-btn:active{transform:scale(.97);opacity:.9}

/* 収益 */
.revenue-bar{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.revenue-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--green),var(--purple))}
.revenue-progress{height:28px;background:rgba(8,8,16,.5);border-radius:14px;overflow:hidden;margin:12px 0;border:1px solid var(--border)}
.revenue-fill{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .8s ease;position:relative}
.revenue-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15));border-radius:14px;animation:shimmer 2s infinite}
@keyframes shimmer{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.revenue-target{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-weight:600}
.revenue-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.rev-item{text-align:center;padding:12px;background:rgba(8,8,16,.4);border-radius:10px;border:1px solid var(--border)}
.rev-item .val{font-size:20px;font-weight:900}
.rev-item .label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}

/* スケジュール */
.schedule-item{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:all .2s}
.schedule-time{font-size:20px;font-weight:900;min-width:55px;letter-spacing:-.5px}
.schedule-info{flex:1}
.schedule-type{font-size:9px;padding:3px 8px;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.type-qt{background:rgba(29,155,240,.1);color:var(--accent);border:1px solid rgba(29,155,240,.2)}
.type-thread{background:rgba(249,115,22,.1);color:var(--orange);border:1px solid rgba(249,115,22,.2)}
.type-note{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.golden{border:1px solid rgba(234,179,8,.2);position:relative;overflow:hidden}
.golden::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--yellow),var(--orange))}
.golden-label{font-size:10px;color:var(--yellow);font-weight:600}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(239,68,68,.15);color:var(--red);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.live-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite}

/* トグル */
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:10px}
.toggle-row span{font-size:13px;font-weight:600}
.toggle{position:relative;width:48px;height:26px;background:#1a1a2e;border-radius:13px;cursor:pointer;transition:all .3s;border:1px solid var(--border)}
.toggle.on{background:linear-gradient(135deg,var(--green),#34d399);border-color:transparent}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(22px)}

/* トースト */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:12px 28px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;box-shadow:0 4px 20px rgba(29,155,240,.4);letter-spacing:-.3px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* チャート */
.chart-container{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.chart-title{font-size:13px;font-weight:800;margin-bottom:12px;text-transform:uppercase;letter-spacing:.3px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:6px 6px 0 0;min-height:2px;transition:height .5s ease;background:linear-gradient(to top,var(--accent),var(--accent2))}
.bar-label{font-size:8px;color:var(--dim);font-weight:600}
.bar-val{font-size:9px;color:var(--text);font-weight:700}

.empty-state{text-align:center;padding:50px 20px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px;filter:grayscale(.5)}
.empty-state p{font-size:14px;line-height:1.7}

/* セクションヘッダー */
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.section-header h2{font-size:15px;font-weight:800;letter-spacing:-.3px}
.section-count{font-size:11px;color:var(--dim);background:rgba(29,155,240,.1);padding:2px 8px;border-radius:10px}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">X-OPS</div>
      <div class="logo-sub">AI Content Command Center</div>
    </div>
    <div class="updated"><span class="pulse"></span><span id="lastUpdated"></span></div>
  </div>
  <div class="kpi-bar" id="kpiBar"></div>
</div>

<!-- タブ -->
<div class="tabs" id="mainTabs">
  <div class="tab active" data-tab="buzz">BUZZ</div>
  <div class="tab" data-tab="content">CONTENT</div>
  <div class="tab" data-tab="perf">ANALYTICS</div>
  <div class="tab" data-tab="revenue">REVENUE</div>
  <div class="tab" data-tab="schedule">SCHEDULE</div>
</div>

<!-- Tab 1: バズ速報 -->
<div class="tab-content active" id="tab-buzz">
  <div class="toggle-row">
    <span>投稿済みを非表示</span>
    <div class="toggle" id="hidePosted" onclick="toggleHidePosted()"></div>
  </div>
  <div class="filter-bar" id="buzzFilters"></div>
  <div id="buzzList"></div>
</div>

<!-- Tab 2: スレッド/Notes -->
<div class="tab-content" id="tab-content">
  <div class="filter-bar">
    <button class="filter-btn active" onclick="switchContentSub(this,'threads')">THREADS</button>
    <button class="filter-btn" onclick="switchContentSub(this,'notes')">NOTES</button>
  </div>
  <div id="threadsList"></div>
  <div id="notesList" style="display:none"></div>
</div>

<!-- Tab 3: パフォーマンス -->
<div class="tab-content" id="tab-perf">
  <div class="perf-grid" id="perfGrid"></div>
  <div class="chart-container">
    <div class="chart-title">Daily Impressions (7days)</div>
    <div class="bar-chart" id="impChart"></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">Avg. Imp by Post Type</div>
    <div class="bar-chart" id="typeChart"></div>
  </div>
  <div class="perf-input-group">
    <h3>Record Performance</h3>
    <div class="input-row"><label>URL</label><input id="perfUrl" placeholder="https://x.com/..."></div>
    <div class="input-row"><label>Imp</label><input id="perfImp" type="number" placeholder="0"></div>
    <div class="input-row"><label>Likes</label><input id="perfLikes" type="number" placeholder="0"></div>
    <div class="input-row"><label>RT</label><input id="perfRt" type="number" placeholder="0"></div>
    <div class="input-row"><label>Replies</label><input id="perfReplies" type="number" placeholder="0"></div>
    <button class="save-btn" onclick="savePerf()">SAVE</button>
  </div>
  <div class="perf-input-group">
    <h3>Followers</h3>
    <div class="input-row"><label>Count</label><input id="followerCount" type="number" placeholder="0"></div>
    <button class="save-btn" onclick="saveFollowers()">UPDATE</button>
  </div>
</div>

<!-- Tab 4: 収益 -->
<div class="tab-content" id="tab-revenue">
  <div class="revenue-bar">
    <div style="font-size:16px;font-weight:900;letter-spacing:-.3px">Monthly Revenue</div>
    <div class="revenue-progress"><div class="revenue-fill" id="revFill" style="width:0%"></div></div>
    <div class="revenue-target"><span id="revCurrent">¥0</span><span>TARGET: ¥300,000</span></div>
    <div class="revenue-breakdown">
      <div class="rev-item"><div class="val" style="color:var(--accent)" id="revAd">¥0</div><div class="label">Ad Revenue</div></div>
      <div class="rev-item"><div class="val" style="color:var(--green)" id="revAff">¥0</div><div class="label">Affiliate</div></div>
      <div class="rev-item"><div class="val" style="color:var(--purple)" id="revSpon">¥0</div><div class="label">Sponsored</div></div>
    </div>
  </div>
  <div class="perf-input-group">
    <h3>Record Revenue</h3>
    <div class="input-row"><label>Type</label>
      <select id="revType">
        <option value="ad">Ad Revenue</option>

      document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-'+t.dataset.tab).classList.add('active');
    });
  });
}

/* ===== KPI ===== */
function renderKPI(){
  const perf=LS.get('perf_daily',[]);
  const today=new Date().toISOString().slice(0,10);
  const thisMonth=perf.filter(p=>p.date&&p.date.startsWith(today.slice(0,7)));
  const totalImp=thisMonth.reduce((s,p)=>s+(p.impressions||0),0);
  const followers=LS.get('followers',0);
  const pending=BUZZ.filter(b=>!LS.get('posted_'+b.id)).length;
  const rev=LS.get('revenue_monthly',[]).filter(r=>r.month===today.slice(0,7));
  const totalRev=rev.reduce((s,r)=>s+(r.amount||0),0);
  document.getElementById('kpiBar').innerHTML=`
    <div class="kpi"><div class="kpi-val" style="color:var(--accent)">${fmtN(totalImp)}</div><div class="kpi-label">Monthly Imp</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--green)">¥${fmtN(totalRev)}</div><div class="kpi-label">Revenue</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--purple)">${fmtN(followers)}</div><div class="kpi-label">Followers</div></div>
    <div class="kpi"><div class="kpi-val" style="color:var(--yellow)">${pending}</div><div class="kpi-label">Queue</div></div>`;
}

/* ===== バズ速報 ===== */
let hidePosted=LS.get('hidePosted',false);
let activeCat='all';

function renderBuzz(){
  const cats=[...new Set(BUZZ.map(b=>b.category))];
  document.getElementById('buzzFilters').innerHTML=
    `<button class="filter-btn ${activeCat==='all'?'active':''}" onclick="filterCat('all')">ALL</button>`+
    cats.map(c=>`<button class="filter-btn ${activeCat===c?'active':''}" onclick="filterCat('${c}')">${c.toUpperCase()}</button>`).join('');
  if(hidePosted)document.getElementById('hidePosted').classList.add('on');
  const html=BUZZ.map(b=>{
    const posted=LS.get('posted_'+b.id,false);
    const hidden=(hidePosted&&posted)||(activeCat!=='all'&&b.category!==activeCat);
    const type=LS.get('type_'+b.id,'qt');
    const pat=LS.get('pat_'+b.id,0);
    const texts=type==='qt'?b.quotes:b.replies;
    const text=texts&&texts[pat]?texts[pat].text:'';
    return `<div class="buzz-card ${posted?'posted':''} ${hidden?'hidden':''}" id="card-${b.id}">
      <div class="buzz-meta">
        <div><span class="buzz-author">${b.author}</span><span class="buzz-handle">${b.author_handle||''}</span></div>
        <span class="badge ${b.urgency||'medium'}">${(b.urgency||'MEDIUM').toUpperCase()}</span>
      </div>
      <div class="buzz-summary">${b.summary_ja||''}</div>
      <div class="buzz-stats">
        <span class="buzz-views">${b.views_estimate||''} views</span>
        <a class="buzz-link" href="${b.source_url}" target="_blank">Open &rarr;</a>
      </div>
      <div class="type-tabs">
        <div class="type-tab ${type==='qt'?'active-qt':''}" onclick="switchType('${b.id}','qt')">Quote RT</div>
        <div class="type-tab ${type==='rp'?'active-rp':''}" onclick="switchType('${b.id}','rp')">Reply</div>
      </div>
      <div class="patterns">
        ${[0,1,2].map(i=>`<div class="pat-btn ${pat===i?'sel':''}" onclick="switchPat('${b.id}',${i})">${i+1}</div>`).join('')}
      </div>
      <div class="content-box" onclick="copyText(this)">${text}</div>
      <div class="char-count">${text.length}字</div>
      <div class="card-footer">
        <span class="recommend">${b.recommended_action==='quote_rt'?'QUOTE RT':'REPLY'}</span>
        <button class="check-btn ${posted?'checked':''}" onclick="togglePosted('${b.id}')">${posted?'POSTED':'PENDING'}</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('buzzList').innerHTML=html||'<div class="empty-state"><div class="icon">📡</div><p>No buzz alerts yet<br>Next scan in progress...</p></div>';
}

function switchType(id,type){LS.set('type_'+id,type);LS.set('pat_'+id,0);renderBuzz()}
function switchPat(id,pat){LS.set('pat_'+id,pat);renderBuzz()}
function togglePosted(id){LS.set('posted_'+id,!LS.get('posted_'+id,false));renderBuzz();renderKPI()}
function toggleHidePosted(){hidePosted=!hidePosted;LS.set('hidePosted',hidePosted);document.getElementById('hidePosted').classList.toggle('on');renderBuzz()}
function filterCat(c){activeCat=c;renderBuzz()}

/* ===== スレッド ===== */
function renderThreads(){
  const html=THREADS.map(t=>{
    const tw=t.tweets||[];
    return `<div class="thread-card">
      <div class="thread-title">${t.title}</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:10px">${tw.length} tweets | ${(t.category||'').toUpperCase()}</div>
      ${tw.map(x=>`<div class="thread-tweet" onclick="copyText(this)"><span class="thread-num">${x.seq}/</span>${x.text}</div>`).join('')}
      <button class="copy-all-btn" onclick="copyThread('${t.id}')">COPY ALL</button>
    </div>`;
  }).join('');
  document.getElementById('threadsList').innerHTML=html||'<div class="empty-state"><div class="icon">🧵</div><p>No threads yet</p></div>';
}
function copyThread(id){const t=THREADS.find(x=>x.id===id);if(!t)return;navigator.clipboard.writeText(t.tweets.map(x=>x.text).join('\n\n'));showToast('Thread copied!')}

/* ===== Notes ===== */
function renderNotes(){
  const html=NOTES.map(n=>{
    return `<div class="note-card">
      <div class="note-title">${n.title}</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px">${fmtN(n.char_count||0)} chars | ${(n.category||'').toUpperCase()}</div>
      <div class="note-preview">${(n.body||'').slice(0,250)}</div>
      <button class="copy-all-btn" onclick="copyNote('${n.id}')">COPY FULL ARTICLE</button>
    </div>`;
  }).join('');
  document.getElementById('notesList').innerHTML=html||'<div class="empty-state"><div class="icon">📝</div><p>No notes yet</p></div>';
}
function copyNote(id){const n=NOTES.find(x=>x.id===id);if(!n)return;navigator.clipboard.writeText(n.body||'');showToast('Article copied!')}
function switchContentSub(btn,sub){btn.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('threadsList').style.display=sub==='threads'?'block':'none';document.getElementById('notesList').style.display=sub==='notes'?'block':'none'}

/* ===== パフォーマンス ===== */
function renderPerf(){
  const perf=LS.get('perf_daily',[]);const last7=perf.slice(-7);
  const totalImp=perf.reduce((s,p)=>s+(p.impressions||0),0);
  const totalEng=perf.reduce((s,p)=>s+(p.likes||0)+(p.retweets||0),0);
  const avgImp=perf.length?Math.round(totalImp/perf.length):0;
  const engRate=totalImp?((totalEng/totalImp)*100).toFixed(2):'0.00';
  document.getElementById('perfGrid').innerHTML=`
    <div class="perf-card"><div class="perf-val" style="color:var(--accent)">${fmtN(totalImp)}</div><div class="perf-label">Total Imp</div></div>
    <div class="perf-card"><div class="perf-val" style="color:var(--green)">${engRate}%</div><div class="perf-label">Eng Rate</div></div>
    <div class="perf-card"><div class="perf-val" style="color:var(--orange)">${fmtN(avgImp)}</div><div class="perf-label">Avg/Day</div></div>
    <div class="perf-card"><div class="perf-val" style="color:var(--purple)">${perf.length}</div><div class="perf-label">Days Tracked</div></div>`;
  if(last7.length>0){
    const mx=Math.max(...last7.map(d=>d.impressions||0),1);
    document.getElementById('impChart').innerHTML=last7.map(d=>{const h=Math.max(((d.impressions||0)/mx)*100,3);
      return `<div class="bar-col"><div class="bar-val">${fmtN(d.impressions||0)}</div><div class="bar" style="height:${h}%"></div><div class="bar-label">${(d.date||'').slice(5)}</div></div>`;}).join('');
  }
  const byType={};perf.forEach(p=>{const t=p.type||'other';if(!byType[t])byType[t]={total:0,count:0};byType[t].total+=p.impressions||0;byType[t].count++});
  const tl={quote_rt:'Quote',reply:'Reply',thread:'Thread',note:'Notes',other:'Other'};
  const te=Object.entries(byType);
  if(te.length>0){const mx=Math.max(...te.map(([,v])=>v.count?v.total/v.count:0),1);
    document.getElementById('typeChart').innerHTML=te.map(([k,v])=>{const avg=v.count?Math.round(v.total/v.count):0;const h=Math.max((avg/mx)*100,3);
      return `<div class="bar-col"><div class="bar-val">${fmtN(avg)}</div><div class="bar" style="height:${h}%"></div><div class="bar-label">${tl[k]||k}</div></div>`;}).join('')}
}
function savePerf(){
  const d=LS.get('perf_daily',[]);d.push({date:new Date().toISOString().slice(0,10),url:document.getElementById('perfUrl').value,
    impressions:parseInt(document.getElementById('perfImp').value)||0,likes:parseInt(document.getElementById('perfLikes').value)||0,
    retweets:parseInt(document.getElementById('perfRt').value)||0,replies:parseInt(document.getElementById('perfReplies').value)||0,type:'other'});
  LS.set('perf_daily',d);['perfUrl','perfImp','perfLikes','perfRt','perfReplies'].forEach(id=>document.getElementById(id).value='');renderPerf();renderKPI();showToast('Saved!')}
function saveFollowers(){LS.set('followers',parseInt(document.getElementById('followerCount').value)||0);document.getElementById('followerCount').value='';renderKPI();showToast('Updated!')}

/* ===== 収益 ===== */
function renderRevenue(){
  const today=new Date().toISOString().slice(0,10);const month=today.slice(0,7);
  const entries=LS.get('revenue_monthly',[]);const tm=entries.filter(r=>r.month===month);
  const ad=tm.filter(r=>r.type==='ad').reduce((s,r)=>s+(r.amount||0),0);
  const aff=tm.filter(r=>r.type==='affiliate').reduce((s,r)=>s+(r.amount||0),0);
  const spon=tm.filter(r=>r.type==='sponsored').reduce((s,r)=>s+(r.amount||0),0);
  const total=ad+aff+spon;const pct=Math.min((total/300000)*100,100);
  document.getElementById('revFill').style.width=pct+'%';
  document.getElementById('revCurrent').textContent=`¥${fmtN(total)} (${pct.toFixed(1)}%)`;
  document.getElementById('revAd').textContent='¥'+fmtN(ad);
  document.getElementById('revAff').textContent='¥'+fmtN(aff);
  document.getElementById('revSpon').textContent='¥'+fmtN(spon);
  document.getElementById('revHistory').innerHTML=entries.slice(-10).reverse().map(r=>{
    const tl={ad:'AD',affiliate:'AFFI',sponsored:'SPON'}[r.type]||r.type;
    return `<div class="schedule-item"><div class="schedule-time" style="color:var(--green)">¥${fmtN(r.amount||0)}</div><div class="schedule-info"><div style="font-size:13px;font-weight:600">${tl} — ${r.memo||''}</div><div style="font-size:10px;color:var(--dim)">${r.date||''}</div></div></div>`;}).join('')}
function saveRevenue(){
  const e=LS.get('revenue_monthly',[]);const today=new Date().toISOString().slice(0,10);
  e.push({month:today.slice(0,7),date:today,type:document.getElementById('revType').value,amount:parseInt(document.getElementById('revAmount').value)||0,memo:document.getElementById('revMemo').value});
  LS.set('revenue_monthly',e);['revAmount','revMemo'].forEach(id=>document.getElementById(id).value='');renderRevenue();renderKPI();showToast('Saved!')}

/* ===== スケジュール ===== */
function renderSchedule(){
  const now=new Date();const isWE=now.getDay()===0||now.getDay()===6;
  const times=isWE?['10:00','20:00']:['07:00','12:00','21:00'];
  const h=now.getHours();
  document.getElementById('goldenTimes').innerHTML=times.map(t=>{const th=parseInt(t);const passed=h>=th+1;const isNow=h>=th&&h<th+1;
    return `<div class="schedule-item golden" style="${passed?'opacity:.35':''}">
      <div class="schedule-time" style="color:var(--yellow)">${t}</div>
      <div class="schedule-info">
        <div style="font-size:13px;font-weight:700">${isNow?'<span class="live-badge">LIVE</span> ':''} Golden Time</div>
        <div class="golden-label">${isWE?'Weekend':'Weekday'} optimal</div>
      </div></div>`;}).join('');
  const pending=BUZZ.filter(b=>!LS.get('posted_'+b.id));
  document.getElementById('queueCount').textContent=pending.length;
  document.getElementById('scheduleList').innerHTML=pending.slice(0,8).map((b,i)=>{const nt=times[i%times.length]||'21:00';
    return `<div class="schedule-item">
      <div class="schedule-time" style="color:var(--accent)">${nt}</div>
      <div class="schedule-info">
        <div style="font-size:13px;font-weight:600">${b.author}</div>
        <div style="font-size:11px;color:var(--dim)">${(b.summary_ja||'').slice(0,40)}...</div>
        <span class="schedule-type type-qt">${b.recommended_action==='quote_rt'?'QUOTE RT':'REPLY'}</span>
      </div></div>`;}).join('')||'<div class="empty-state"><p>Queue empty</p></div>'}

/* ===== ユーティリティ ===== */
function copyText(el){navigator.clipboard.writeText(el.textContent);showToast('Copied!')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function fmtN(n){if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=10000)return(n/10000).toFixed(1)+'万';if(n>=1000)return(n/1000).toFixed(1)+'K';return n.toString()}
</script>
