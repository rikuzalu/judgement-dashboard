<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>X運用ダッシュボード | @B_Q_Caique</title>
<style>
:root{--bg:#0a0a0a;--card:#111;--border:#222;--accent:#1d9bf0;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--purple:#a855f7;--orange:#f97316;--text:#e0e0e0;--dim:#888;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}

/* ヘッダー */
.header{background:#111;border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:800;color:var(--accent)}
.logo span{color:var(--dim);font-size:12px;font-weight:400;margin-left:8px}
.updated{font-size:11px;color:var(--dim)}

/* KPIバー */
.kpi-bar{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.kpi{background:#1a1a1a;border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:80px;text-align:center;flex-shrink:0}
.kpi-val{font-size:18px;font-weight:800;color:var(--accent)}
.kpi-label{font-size:10px;color:var(--dim);margin-top:2px}
.kpi-val.green{color:var(--green)}
.kpi-val.yellow{color:var(--yellow)}
.kpi-val.red{color:var(--red)}

/* タブ */
.tabs{display:flex;border-bottom:1px solid var(--border);background:#111;position:sticky;top:68px;z-index:99;overflow-x:auto}
.tab{flex:1;padding:10px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-width:60px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* タブコンテンツ */
.tab-content{display:none;padding:12px}
.tab-content.active{display:block}

/* フィルタバー */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;cursor:pointer}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* バズカード */
.buzz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:opacity .3s}
.buzz-card.posted{opacity:.3}
.buzz-card.hidden{display:none}
.buzz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.buzz-author{font-weight:700;font-size:14px}
.buzz-handle{color:var(--dim);font-size:12px}
.badge{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700}
.badge.high{background:rgba(239,68,68,.2);color:var(--red)}
.badge.medium{background:rgba(234,179,8,.2);color:var(--yellow)}
.badge.low{background:rgba(34,197,94,.2);color:var(--green)}
.buzz-summary{font-size:13px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.buzz-views{font-size:11px;color:var(--dim)}
.buzz-link{color:var(--accent);text-decoration:none;font-size:11px;margin-left:8px}

/* コンテンツ切替（引用RT/リプライ） */
.type-tabs{display:flex;gap:4px;margin:10px 0 8px}
.type-tab{flex:1;padding:6px;text-align:center;font-size:12px;border-radius:6px;cursor:pointer;border:1px solid var(--border);color:var(--dim)}
.type-tab.active-qt{background:rgba(29,155,240,.15);color:var(--accent);border-color:var(--accent)}
.type-tab.active-rp{background:rgba(168,85,247,.15);color:var(--purple);border-color:var(--purple)}

/* パターン選択 */
.patterns{display:flex;gap:6px;margin-bottom:8px}
.pat-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pat-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent)}

/* テキストエリア */
.content-box{background:#0d0d0d;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;line-height:1.7;cursor:pointer;position:relative;min-height:60px;word-wrap:break-word}
.content-box:active{background:#1a1a1a}
.char-count{text-align:right;font-size:10px;color:var(--dim);margin-top:4px}

/* チェックボックス */
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.check-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;cursor:pointer}
.check-btn.checked{background:var(--green);color:#fff;border-color:var(--green)}
.recommend{font-size:11px;padding:3px 8px;border-radius:4px;background:rgba(29,155,240,.1);color:var(--accent)}

/* スレッドカード */
.thread-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.thread-title{font-weight:700;font-size:15px;margin-bottom:8px}
.thread-tweet{background:#0d0d0d;border-left:3px solid var(--accent);padding:10px 12px;margin:6px 0;border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;cursor:pointer}
.thread-tweet:active{background:#1a1a1a}
.thread-num{color:var(--accent);font-weight:700;margin-right:6px}
.copy-all-btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;margin-top:8px}
.copy-all-btn:active{background:rgba(29,155,240,.1)}

/* Notes */
.note-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.note-title{font-weight:700;font-size:16px;margin-bottom:6px}
.note-preview{font-size:13px;color:var(--dim);line-height:1.6;max-height:100px;overflow:hidden;margin-bottom:10px}

/* パフォーマンス */
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.perf-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.perf-val{font-size:22px;font-weight:800}
.perf-label{font-size:11px;color:var(--dim);margin-top:2px}
.perf-input-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.perf-input-group h3{font-size:14px;margin-bottom:10px}
.input-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.input-row label{font-size:12px;color:var(--dim);min-width:60px}
.input-row input{flex:1;background:#0d0d0d;border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:14px}
.save-btn{width:100%;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
.save-btn:active{opacity:.8}

/* 収益 */
.revenue-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.revenue-progress{height:24px;background:#1a1a1a;border-radius:12px;overflow:hidden;margin:10px 0}
.revenue-fill{height:100%;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .5s}
.revenue-target{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.revenue-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.rev-item{text-align:center;padding:10px;background:#0d0d0d;border-radius:8px}
.rev-item .val{font-size:18px;font-weight:800}
.rev-item .label{font-size:10px;color:var(--dim)}

/* スケジュール */
.schedule-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.schedule-time{font-size:18px;font-weight:800;color:var(--accent);min-width:50px}
.schedule-info{flex:1}
.schedule-type{font-size:10px;padding:2px 6px;border-radius:4px}
.type-qt{background:rgba(29,155,240,.15);color:var(--accent)}
.type-thread{background:rgba(249,115,22,.15);color:var(--orange)}
.type-note{background:rgba(168,85,247,.15);color:var(--purple)}
.golden{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3)}
.golden-label{font-size:10px;color:var(--yellow)}

/* トグル */
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toggle{position:relative;width:44px;height:24px;background:#333;border-radius:12px;cursor:pointer}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}

/* トースト */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 24px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* チャート */
.chart-container{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.chart-title{font-size:13px;font-weight:700;margin-bottom:10px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.bar-label{font-size:9px;color:var(--dim)}
.bar-val{font-size:9px;color:var(--text);font-weight:600}

.empty-state{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-top">
    <div class="logo">X-OPS <span>@B_Q_Caique</span></div>
    <div class="updated" id="lastUpdated"></div>
  </div>
  <div class="kpi-bar" id="kpiBar"></div>
</div>

<!-- タブ -->
<div class="tabs" id="mainTabs">
  <div class="tab active" data-tab="buzz">速報</div>
  <div class="tab" data-tab="content">記事</div>
  <div class="tab" data-tab="perf">分析</div>
  <div class="tab" data-tab="revenue">収益</div>
  <div class="tab" data-tab="schedule">予定</div>
</div>

<!-- Tab 1: バズ速報 -->
<div class="tab-content active" id="tab-buzz">
  <div class="toggle-row">
    <span style="font-size:13px">投稿済みを非表示</span>
    <div class="toggle" id="hidePosted" onclick="toggleHidePosted()"></div>
  </div>
  <div class="filter-bar" id="buzzFilters"></div>
  <div id="buzzList"></div>
</div>

<!-- Tab 2: スレッド/Notes -->
<div class="tab-content" id="tab-content">
  <div class="filter-bar">
    <button class="filter-btn active" onclick="switchContentSub(this,'threads')">スレッド</button>
    <button class="filter-btn" onclick="switchContentSub(this,'notes')">Notes</button>
  </div>
  <div id="threadsList"></div>
  <div id="notesList" style="display:none"></div>
</div>

<!-- Tab 3: パフォーマンス -->
<div class="tab-content" id="tab-perf">
  <div class="perf-grid" id="perfGrid"></div>
  <div class="chart-container">
    <div class="chart-title">日別インプレッション（直近7日）</div>
    <div class="bar-chart" id="impChart"></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">投稿タイプ別 平均imp</div>
    <div class="bar-chart" id="typeChart"></div>
  </div>
  <div class="perf-input-group">
    <h3>パフォーマンス入力</h3>
    <div class="input-row"><label>投稿URL</label><input id="perfUrl" placeholder="https://x.com/..."></div>
    <div class="input-row"><label>imp</label><input id="perfImp" type="number" placeholder="0"></div>
    <div class="input-row"><label>いいね</label><input id="perfLikes" type="number" placeholder="0"></div>
    <div class="input-row"><label>RT</label><input id="perfRt" type="number" placeholder="0"></div>
    <div class="input-row"><label>リプライ</label><input id="perfReplies" type="number" placeholder="0"></div>
    <button class="save-btn" onclick="savePerf()">記録する</button>
  </div>
  <div class="perf-input-group">
    <h3>フォロワー数記録</h3>
    <div class="input-row"><label>現在数</label><input id="followerCount" type="number" placeholder="0"></div>
    <button class="save-btn" onclick="saveFollowers()">記録する</button>
  </div>
</div>

<!-- Tab 4: 収益 -->
<div class="tab-content" id="tab-revenue">
  <div class="revenue-bar">
    <div style="font-size:14px;font-weight:700">月間収益目標</div>
    <div class="revenue-progress"><div class="revenue-fill" id="revFill" style="width:0%"></div></div>
    <div class="revenue-target"><span id="revCurrent">0</span><span>目標: ¥300,000</span></div>
    <div class="revenue-breakdown">
      <div class="rev-item"><div class="val" style="color:var(--accent)" id="revAd">¥0</div><div class="label">広告収益</div></div>
      <div class="rev-item"><div class="val" style="color:var(--green)" id="revAff">¥0</div><div class="label">アフィリエイト</div></div>
      <div class="rev-item"><div class="val" style="color:var(--purple)" id="revSpon">¥0</div><div class="label">案件</div></div>
    </div>
  </div>
  <div class="perf-input-group">
    <h3>収益入力</h3>
    <div class="input-row"><label>種別</label>
      <select id="revType" style="flex:1;background:#0d0d0d;border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:14px">
        <option value="ad">広告収益</option>
        <option value="affiliate">アフィリエイト</option>
        <option value="sponsored">案件</option>
      </select>
    </div>
    <div class="input-row"><label>金額(¥)</label><input id="revAmount" type="number" placeholder="0"></div>
    <div class="input-row"><label>メモ</label><input id="revMemo" placeholder="内容..."></div>
    <button class="save-btn" onclick="saveRevenue()">記録する</button>
  </div>
  <div id="revHistory"></div>
</div>

<!-- Tab 5: スケジュール -->
<div class="tab-content" id="tab-schedule">
  <div style="margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px">今日の投稿予定</div>
    <div id="scheduleList"></div>
  </div>
  <div style="margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px">最適投稿時間</div>
    <div id="goldenTimes"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  const followers = LS.get('followers', 0);
  const pending = BUZZ.filter(b => !LS.get('posted_'+b.id)).length;
  const rev = LS.get('revenue_monthly', []).filter(r => r.month === today.slice(0,7));
  const totalRev = rev.reduce((s,r) => s + (r.amount||0), 0);

  document.getElementById('kpiBar').innerHTML = `
    <div class="kpi"><div class="kpi-val">${formatNum(totalImp)}</div><div class="kpi-label">今月imp</div></div>
    <div class="kpi"><div class="kpi-val green">¥${formatNum(totalRev)}</div><div class="kpi-label">今月収益</div></div>
    <div class="kpi"><div class="kpi-val">${formatNum(followers)}</div><div class="kpi-label">フォロワー</div></div>
    <div class="kpi"><div class="kpi-val yellow">${pending}</div><div class="kpi-label">未投稿</div></div>
  `;
}

/* ===== バズ速報 ===== */
let hidePosted = LS.get('hidePosted', false);
let activeCategory = 'all';

function renderBuzz(){
  // カテゴリフィルタ
  const cats = [...new Set(BUZZ.map(b => b.category))];
  const filterHtml = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="filterCat('all')">全て</button>` +
    cats.map(c => `<button class="filter-btn ${activeCategory===c?'active':''}" onclick="filterCat('${c}')">${c}</button>`).join('');
  document.getElementById('buzzFilters').innerHTML = filterHtml;

  if(hidePosted) document.getElementById('hidePosted').classList.add('on');

  const html = BUZZ.map(b => {
    const posted = LS.get('posted_'+b.id, false);
    const hidden = (hidePosted && posted) || (activeCategory !== 'all' && b.category !== activeCategory);
    const type = LS.get('type_'+b.id, 'qt');
    const pat = LS.get('pat_'+b.id, 0);
    const texts = type === 'qt' ? b.quotes : b.replies;
    const text = texts && texts[pat] ? texts[pat].text : '';
    const charCount = text.length;

    return `<div class="buzz-card ${posted?'posted':''} ${hidden?'hidden':''}" id="card-${b.id}">
      <div class="buzz-meta">
        <div><span class="buzz-author">${b.author}</span> <span class="buzz-handle">${b.author_handle||''}</span></div>
        <span class="badge ${b.urgency||'medium'}">${(b.urgency||'medium').toUpperCase()}</span>
      </div>
      <div class="buzz-summary">${b.summary_ja||''}</div>
      <div class="buzz-views">${b.views_estimate||''} views<a class="buzz-link" href="${b.source_url}" target="_blank">元ツイート</a></div>
      <div class="type-tabs">
        <div class="type-tab ${type==='qt'?'active-qt':''}" onclick="switchType('${b.id}','qt')">引用RT</div>
        <div class="type-tab ${type==='rp'?'active-rp':''}" onclick="switchType('${b.id}','rp')">リプライ</div>
      </div>
      <div class="patterns">
        ${[0,1,2].map(i => `<div class="pat-btn ${pat===i?'sel':''}" onclick="switchPat('${b.id}',${i})">${i+1}</div>`).join('')}
      </div>
      <div class="content-box" onclick="copyText(this)">${text}</div>
      <div class="char-count">${charCount}文字</div>
      <div class="card-footer">
        <span class="recommend">${b.recommended_action==='quote_rt'?'引用RT推奨':'リプライ推奨'}</span>
        <button class="check-btn ${posted?'checked':''}" onclick="togglePosted('${b.id}')">${posted?'投稿済み':'未投稿'}</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('buzzList').innerHTML = html || '<div class="empty-state"><div class="icon">📡</div><p>バズ速報がありません<br>次回更新をお待ちください</p></div>';
}

function switchType(id, type){
  LS.set('type_'+id, type);
  LS.set('pat_'+id, 0);
  renderBuzz();
}
function switchPat(id, pat){
  LS.set('pat_'+id, pat);
  renderBuzz();
}
function togglePosted(id){
  LS.set('posted_'+id, !LS.get('posted_'+id, false));
  renderBuzz();
  renderKPI();
}
function toggleHidePosted(){
  hidePosted = !hidePosted;
  LS.set('hidePosted', hidePosted);
  document.getElementById('hidePosted').classList.toggle('on');
  renderBuzz();
}
function filterCat(cat){
  activeCategory = cat;
  renderBuzz();
}

/* ===== スレッド ===== */
function renderThreads(){
  const html = THREADS.map(t => {
    const tweets = t.tweets || [];
    return `<div class="thread-card">
      <div class="thread-title">${t.title}</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px">${tweets.length}ツイート | ${t.category||''}</div>
      ${tweets.map(tw => `<div class="thread-tweet" onclick="copyText(this)"><span class="thread-num">${tw.seq}/</span>${tw.text}</div>`).join('')}
      <button class="copy-all-btn" onclick="copyThread('${t.id}')">全文コピー</button>
    </div>`;
  }).join('');
  document.getElementById('threadsList').innerHTML = html || '<div class="empty-state"><div class="icon">🧵</div><p>スレッドの下書きがありません</p></div>';
}

function copyThread(id){
  const t = THREADS.find(x => x.id === id);
  if(!t) return;
  const full = t.tweets.map(tw => tw.text).join('\n\n---\n\n');
  navigator.clipboard.writeText(full);
  showToast('スレッド全文コピー！');
}

/* ===== Notes ===== */
function renderNotes(){
  const html = NOTES.map(n => {
    return `<div class="note-card">
      <div class="note-title">${n.title}</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:8px">${n.char_count||0}文字</div>
      <div class="note-preview">${(n.body||'').slice(0,200)}...</div>
      <button class="copy-all-btn" onclick="copyNote('${n.id}')">全文コピー</button>
    </div>`;
  }).join('');
  document.getElementById('notesList').innerHTML = html || '<div class="empty-state"><div class="icon">📝</div><p>Notes記事の下書きがありません</p></div>';
}

function copyNote(id){
  const n = NOTES.find(x => x.id === id);
  if(!n) return;
  navigator.clipboard.writeText(n.body || '');
  showToast('Notes全文コピー！');
}

function switchContentSub(btn, sub){
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('threadsList').style.display = sub==='threads' ? 'block' : 'none';
  document.getElementById('notesList').style.display = sub==='notes' ? 'block' : 'none';
}

/* ===== パフォーマンス ===== */
function renderPerf(){
  const perf = LS.get('perf_daily', []);
  const last7 = perf.slice(-7);
  const totalImp = perf.reduce((s,p) => s + (p.impressions||0), 0);
  const totalEng = perf.reduce((s,p) => s + (p.likes||0) + (p.retweets||0), 0);
  const avgImp = perf.length ? Math.round(totalImp / perf.length) : 0;
  const engRate = totalImp ? ((totalEng / totalImp) * 100).toFixed(2) : '0';

  document.getElementById('perfGrid').innerHTML = `
    <div class="perf-card"><div class="perf-val" style="color:var(--accent)">${formatNum(totalImp)}</div><div class="perf-label">累計imp</div></div>
    <div class="perf-card"><div class="perf-val" style="color:var(--green)">${engRate}%</div><div class="perf-label">エンゲージ率</div></div>
    <div class="perf-card"><div class="perf-val" style="color:var(--orange)">${formatNum(avgImp)}</div><div class="perf-label">平均imp/日</div></div>
    <div class="perf-card"><div class="perf-val" style="color:var(--purple)">${perf.length}</div><div class="perf-label">記録日数</div></div>
  `;

  // 日別impチャート
  if(last7.length > 0){
    const maxImp = Math.max(...last7.map(d => d.impressions||0), 1);
    document.getElementById('impChart').innerHTML = last7.map(d => {
      const h = Math.max(((d.impressions||0)/maxImp)*100, 2);
      return `<div class="bar-col"><div class="bar-val">${formatNum(d.impressions||0)}</div><div class="bar" style="height:${h}%"></div><div class="bar-label">${(d.date||'').slice(5)}</div></div>`;
    }).join('');
  }

  // タイプ別チャート
  const byType = {};
  perf.forEach(p => {
    const t = p.type || 'other';
    if(!byType[t]) byType[t] = {total:0, count:0};
    byType[t].total += p.impressions || 0;
    byType[t].count++;
  });
  const typeLabels = {quote_rt:'引用RT', reply:'リプライ', thread:'スレッド', note:'Notes', other:'その他'};
  const typeEntries = Object.entries(byType);
  if(typeEntries.length > 0){
    const maxAvg = Math.max(...typeEntries.map(([,v]) => v.count ? v.total/v.count : 0), 1);
    document.getElementById('typeChart').innerHTML = typeEntries.map(([k,v]) => {
      const avg = v.count ? Math.round(v.total/v.count) : 0;
      const h = Math.max((avg/maxAvg)*100, 2);
      return `<div class="bar-col"><div class="bar-val">${formatNum(avg)}</div><div class="bar" style="height:${h}%"></div><div class="bar-label">${typeLabels[k]||k}</div></div>`;
    }).join('');
  }
}

function savePerf(){
  const data = LS.get('perf_daily', []);
  const today = new Date().toISOString().slice(0,10);
  data.push({
    date: today,
    url: document.getElementById('perfUrl').value,
    impressions: parseInt(document.getElementById('perfImp').value)||0,
    likes: parseInt(document.getElementById('perfLikes').value)||0,
    retweets: parseInt(document.getElementById('perfRt').value)||0,
    replies: parseInt(document.getElementById('perfReplies').value)||0,
    type: 'other'
  });
  LS.set('perf_daily', data);
  ['perfUrl','perfImp','perfLikes','perfRt','perfReplies'].forEach(id => document.getElementById(id).value='');
  renderPerf();
  renderKPI();
  showToast('パフォーマンス記録完了！');
}

function saveFollowers(){
  const count = parseInt(document.getElementById('followerCount').value)||0;
  LS.set('followers', count);
  document.getElementById('followerCount').value = '';
  renderKPI();
  showToast('フォロワー数更新！');
}

/* ===== 収益 ===== */
function renderRevenue(){
  const today = new Date().toISOString().slice(0,10);
  const month = today.slice(0,7);
  const entries = LS.get('revenue_monthly', []);
  const thisMonth = entries.filter(r => r.month === month);
  const ad = thisMonth.filter(r=>r.type==='ad').reduce((s,r)=>s+(r.amount||0),0);
  const aff = thisMonth.filter(r=>r.type==='affiliate').reduce((s,r)=>s+(r.amount||0),0);
  const spon = thisMonth.filter(r=>r.type==='sponsored').reduce((s,r)=>s+(r.amount||0),0);
  const total = ad + aff + spon;
  const pct = Math.min((total/300000)*100, 100);

  document.getElementById('revFill').style.width = pct + '%';
  document.getElementById('revCurrent').textContent = `¥${formatNum(total)} (${pct.toFixed(1)}%)`;
  document.getElementById('revAd').textContent = '¥'+formatNum(ad);
  document.getElementById('revAff').textContent = '¥'+formatNum(aff);
  document.getElementById('revSpon').textContent = '¥'+formatNum(spon);

  // 履歴
  const hist = entries.slice(-10).reverse().map(r => {
    const typeLabel = {ad:'広告',affiliate:'アフィ',sponsored:'案件'}[r.type]||r.type;
    return `<div class="schedule-item"><div class="schedule-time">¥${formatNum(r.amount||0)}</div><div class="schedule-info"><div style="font-size:13px">${typeLabel} — ${r.memo||''}</div><div style="font-size:10px;color:var(--dim)">${r.date||''}</div></div></div>`;
  }).join('');
  document.getElementById('revHistory').innerHTML = hist;
}

function saveRevenue(){
  const entries = LS.get('revenue_monthly', []);
  const today = new Date().toISOString().slice(0,10);
  entries.push({
    month: today.slice(0,7),
    date: today,
    type: document.getElementById('revType').value,
    amount: parseInt(document.getElementById('revAmount').value)||0,
    memo: document.getElementById('revMemo').value
  });
  LS.set('revenue_monthly', entries);
  ['revAmount','revMemo'].forEach(id => document.getElementById(id).value='');
  renderRevenue();
  renderKPI();
  showToast('収益記録完了！');
}

/* ===== スケジュール ===== */
function renderSchedule(){
  const now = new Date();
  const isWeekend = now.getDay()===0||now.getDay()===6;
  const times = isWeekend ? ['10:00','20:00'] : ['07:00','12:00','21:00'];
  const currentH = now.getHours();

  // ゴールデンタイム
  const goldenHtml = times.map(t => {
    const h = parseInt(t);
    const passed = currentH >= h + 1;
    const isNow = currentH >= h && currentH < h + 1;
    return `<div class="schedule-item golden" style="${passed?'opacity:.4':''}">
      <div class="schedule-time">${t}</div>
      <div class="schedule-info">
        <div style="font-size:13px">${isNow?'🔴 今がゴールデンタイム！':'ゴールデンタイム'}</div>
        <div class="golden-label">${isWeekend?'休日':'平日'}最適投稿時間</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('goldenTimes').innerHTML = goldenHtml;

  // 投稿キュー
  const pending = BUZZ.filter(b => !LS.get('posted_'+b.id));
  const queueHtml = pending.slice(0,5).map((b,i) => {
    const nextTime = times[i % times.length] || '21:00';
    return `<div class="schedule-item">
      <div class="schedule-time">${nextTime}</div>
      <div class="schedule-info">
        <div style="font-size:13px">${b.author} — ${(b.summary_ja||'').slice(0,30)}...</div>
        <span class="schedule-type type-qt">${b.recommended_action==='quote_rt'?'引用RT':'リプライ'}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('scheduleList').innerHTML = queueHtml || '<div class="empty-state"><p>投稿キューは空です</p></div>';
}

/* ===== ユーティリティ ===== */
function copyText(el){
  navigator.clipboard.writeText(el.textContent);
  showToast('コピーしました！');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

function formatNum(n){
  if(n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if(n >= 10000) return (n/10000).toFixed(1)+'万';
  if(n >= 1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}
